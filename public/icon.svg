<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="faderCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#1e293b" stroke-width="6" />

  <!-- Outer subtle circuit glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="8 12" />

  <!-- 5 Equalizer Slider Grooves & Faders -->
  <!-- Track 1: Sub Bass (x=112) -->
  <rect x="108" y="120" width="8" height="272" rx="4" fill="#1e293b" />
  <rect x="108" y="220" width="8" height="172" rx="4" fill="url(#amberBar)" />
  <rect x="88" y="210" width="48" height="24" rx="6" fill="url(#faderCap)" stroke="#64748b" stroke-width="2" />
  <line x1="96" y1="222" x2="128" y2="222" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />

  <!-- Track 2: Bass (x=184) -->
  <rect x="180" y="120" width="8" height="272" rx="4" fill="#1e293b" />
  <rect x="180" y="170" width="8" height="222" rx="4" fill="url(#amberBar)" />
  <rect x="160" y="160" width="48" height="24" rx="6" fill="url(#faderCap)" stroke="#64748b" stroke-width="2" />
  <line x1="168" y1="172" x2="200" y2="172" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />

  <!-- Track 3: Vocal / Mid (x=256 - Center) -->
  <rect x="252" y="120" width="8" height="272" rx="4" fill="#1e293b" />
  <rect x="252" y="270" width="8" height="122" rx="4" fill="url(#emeraldBar)" />
  <rect x="232" y="260" width="48" height="24" rx="6" fill="url(#faderCap)" stroke="#64748b" stroke-width="2" />
  <line x1="240" y1="272" x2="272" y2="272" stroke="#34d399" stroke-width="3" stroke-linecap="round" />

  <!-- Track 4: Presence (x=328) -->
  <rect x="324" y="120" width="8" height="272" rx="4" fill="#1e293b" />
  <rect x="324" y="190" width="8" height="202" rx="4" fill="url(#cyanBar)" filter="url(#glowCyan)" />
  <rect x="304" y="180" width="48" height="24" rx="6" fill="url(#faderCap)" stroke="#38bdf8" stroke-width="2" />
  <line x1="312" y1="192" x2="344" y2="192" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Track 5: Treble Air (x=400) -->
  <rect x="396" y="120" width="8" height="272" rx="4" fill="#1e293b" />
  <rect x="396" y="140" width="8" height="252" rx="4" fill="url(#cyanBar)" filter="url(#glowCyan)" />
  <rect x="376" y="130" width="48" height="24" rx="6" fill="url(#faderCap)" stroke="#38bdf8" stroke-width="2" />
  <line x1="384" y1="142" x2="416" y2="142" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Center zero marker line -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Audio Waveform Line at Bottom -->
  <path d="M96 426 Q 130 406 160 426 T 224 426 T 288 426 T 352 426 T 416 426" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.75" />
</svg>
